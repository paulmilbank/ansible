---

- name: kill elementary appcenter
  command: pkill -f io.elementary.appcenter
  ignore_errors: true

- name: install pgadmin apt keyring
  shell: |
    set -o pipefail
    curl -fsSL "{{ pgadmin_repo_pubkey_url }}" | gpg --dearmor -o /usr/share/keyrings/pgadmin.gpg
  args:
    creates: /usr/share/keyrings/pgadmin.gpg
  when: install_pgadmin
  become: true

- name: add pgadmin repo
  apt_repository:
    repo: "{{ pgadmin_repo_url | regex_replace('^deb\\s+', 'deb [signed-by=/usr/share/keyrings/pgadmin.gpg] ') }}"
    state: present
  when: install_pgadmin
  become: true

- name: add pgadmin to postgres packages
  set_fact:
    postgres_packages_ubuntu: "{{ postgres_packages_ubuntu }} + {{ pgagmin_package }}"
  when: install_pgadmin

- name: install postgres packages
  apt:
    name: "{{ postgres_packages_ubuntu }}"
    state: latest
    autoremove: true
    update_cache: true
  become: true
